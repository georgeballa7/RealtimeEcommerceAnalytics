[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-ecommerce-analytics"
version = "0.1.0"
description = "Layered real-time e-commerce analytics platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "mangum>=0.19", "httpx>=0.27"]
shopify = ["httpx>=0.27"]
postgres = ["psycopg[binary]>=3.2"]
aws = ["boto3>=1.35"]
spark = ["pyspark>=3.5"]
historical = ["pandas>=2.2", "openpyxl>=3.1", "pyarrow>=15"]
notebook = ["ipykernel>=6.29", "matplotlib>=3.8", "ipython>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["src", "."]
markers = [
    "integration: requires configured external services",
    "e2e: requires deployed integration environment",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enforce executable correctness while leaving cosmetic import/order rules for later cleanup.
ignore = ["I001", "UP017", "C408"]
