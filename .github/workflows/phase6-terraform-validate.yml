name: Phase 6 Terraform validation

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/phase6-terraform-validate.yml"
  push:
    branches:
      - feature/redshift-warehouse-dbt-churn
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/phase6-terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
      - name: Check Phase 6 formatting without changing files
        run: terraform fmt -check -diff phase6_redshift.tf phase6_rds_exporter.tf phase6_glue_silver.tf
      - name: Initialize providers without remote state or AWS credentials
        run: terraform init -backend=false -input=false -no-color
      - name: Validate full Terraform configuration without applying
        run: terraform validate -no-color
