name: PowerShell operations syntax
on:
  pull_request:
    paths:
      - "scripts/aws/**"
      - "tests/test_phase6_glue_launch.ps1"
      - ".github/workflows/ops-powershell-ci.yml"
  push:
    branches: [main, feature/shopify-live-event-generator, feature/redshift-warehouse-dbt-churn]
    paths:
      - "scripts/aws/**"
      - ".github/workflows/ops-powershell-ci.yml"

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts without executing them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = Get-ChildItem scripts/aws -Filter '*.ps1' -File
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $path.FullName, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              foreach ($errorItem in $parseErrors) {
                Write-Error "$($path.Name): $($errorItem.Message)"
              }
              throw "PowerShell syntax validation failed: $($path.Name)"
            }
            Write-Host "Parsed: $($path.Name)"
          }

      - name: Exercise Phase 6 wrapper with mocked native commands
        shell: pwsh
        run: ./tests/test_phase6_glue_launch.ps1

  windows-native-args:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise launch wrapper under Windows PowerShell 5.1
        shell: powershell
        run: .\\tests\\test_phase6_glue_launch.ps1

      - name: Validate Redshift loader Lambda ZIP with Windows PowerShell 5.1
        shell: powershell
        run: .\\scripts\\aws\\deploy_phase6_silver_loader.ps1

      - name: Validate coordinator Lambda ZIP with Windows PowerShell 5.1
        shell: powershell
        run: .\\scripts\\aws\\deploy_phase6_evening_coordinator.ps1 -ValidateOnly
