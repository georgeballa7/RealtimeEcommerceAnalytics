version: 2
sources:
  - name: silver_staging
    schema: silver_staging
    quoting:
      schema: true
    tables:
      - name: synthetic_orders
        columns:
          - name: order_id
            data_tests: [not_null, unique]
          - name: customer_id
            data_tests: [not_null]
          - name: currency
            data_tests:
              - accepted_values:
                  values: ['GBP']
      - name: synthetic_order_items
        columns:
          - name: order_item_id
            data_tests: [not_null, unique]
          - name: order_id
            data_tests:
              - not_null
              - relationships:
                  to: source('silver_staging', 'synthetic_orders')
                  field: order_id
      - name: synthetic_cancellations
        columns:
          - name: event_id
            data_tests: [not_null, unique]
          - name: order_id
            data_tests:
              - not_null
              - relationships:
                  to: source('silver_staging', 'synthetic_orders')
                  field: order_id
      - name: shopify_live_order
        columns:
          - name: shopify_order_id
            data_tests: [not_null]
      - name: shopify_live_order_line
      - name: shopify_live_refund
      - name: shopify_live_refund_line
      - name: shopify_customer_identity
